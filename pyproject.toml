[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "motoassist"
version = "0.1.0"
description = "Local Windows riding research, monitoring and recording application"
requires-python = ">=3.12,<3.13"
dependencies = ["PySide6-Essentials==6.12.0", "numpy==2.5.5", "opencv-python==5.0.0.93", "psutil==7.2.2", "dxcam==0.3.0; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pyinstaller==6.22.3"]

[project.scripts]
motoassist = "motoassist.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
